linters-settings:
  govet:
    check-shadowing: true
  gocyclo:
    min-complexity: 15
  dupl:
    threshold: 100
  goconst:
    min-len: 2
    min-occurrences: 2

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gofmt
    - goimports
  disable:
    - typecheck

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
  
issues:
  exclude-use-default: false
  exclude-rules:
    # Exclude typecheck issues since go build already validates types
    - linters:
        - typecheck
      text: ".*"
  max-issues-per-linter: 0
  max-same-issues: 0
